name: Build Hurricane Mod
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Ensure gradlew is executable
      run: if [ -f hurricane-mod/gradlew ]; then chmod +x hurricane-mod/gradlew; fi
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    - name: Build with Gradle
      working-directory: ./hurricane-mod
      run: |
        if [ -f gradlew ]; then
          ./gradlew build --no-daemon
        else
          gradle build --no-daemon
        fi
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HurricaneMod-1.20.1-1.0.0
        path: hurricane-mod/build/libs/*.jar
